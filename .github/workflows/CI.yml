name: bentoai-backend

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions: 
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bentoai
          POSTGRES_PASSWORD: bentoai
          POSTGRES_DB: bentoai
        ports:
          - 5432:5432

        options: >-
            --health-cmd "pg_isready -U bentoai -d bentoai"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10
            
    env:
      DB_URL: postgresql+asyncpg://bentoai:bentoai@localhost:5432/bentoai
      LLM_API_KEY: ci-not-used
      JWT_SECRET_KEY: ci-not-used
      OTP_PEPPER: ci-not-used

    steps:
      - uses: actions/checkout@v4
      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true
          prune-cache: false
      - name: install dependencies
        run: uv sync --frozen
        
      - name: Run tests
        run: uv run pytest -q
        

      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Start server
        run: |
          uv run uvicorn bentoai.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "server answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never answered"
          cat server.log
          exit 1
      - name: Smoke test
        run: |
          set -e
          MISSION=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/missions \
            -H 'content-type: application/json' \
            -d '{"goal":"ci smoke test","budget_amount":100,"budget_currency":"CAD","priority":"value"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "created $MISSION"

          curl -sf "http://127.0.0.1:8000/api/v1/missions/$MISSION" \
            | python3 -c '
          import json, sys
          m = json.load(sys.stdin)
          assert m["status"] == "draft", m["status"]
          assert m["priority"] == "value", m["priority"]
          assert m["budget_amount"] == "100.00", m["budget_amount"]
          assert m["pending_questions"] == [], m["pending_questions"]
          print("read back correctly")
          '
      - name: Server log
        if: failure()
        run: cat server.log
    
        
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref_name == 'development'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref_name == 'development' }}
          tags: |
            ghcr.io/alain-16/bentoai:${{ github.sha }}
            ghcr.io/alain-16/bentoai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/bentoai_alain
          chmod 600 ~/.ssh/bentoai_alain
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Test connection
        run: |
          ssh -i ~/.ssh/bentoai_alain \
          "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
          "docker ps"
        
     
  merge:
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push' && github.ref_name == 'development'

    permissions:
      contents: write        # to create the merge commit on main
      pull-requests: write   # to open and merge the PR

    steps:
      - uses: actions/checkout@v4

      - name: Merge development into main
        env:
         
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Reuse an open PR if there is one, otherwise open it. create fai
          # when a PR already exists, and when there is nothing to merge -
          # neither is an error worth stopping for, so the result is checke
          # afterwards instead.
          gh pr create \
            --base main \
            --head development \
            --title "Release ${{ github.sha }}" \
            --body "Automated merge. Tests passed and the image published as:

          \`ghcr.io/alain-16/bentoai:${{ github.sha }}\`" \
            || true

          PR=$(gh pr list --base main --head development --state open \
                 --json number --jq '.[0].number // empty')

          if [ -z "$PR" ]; then
            echo "nothing to merge - main already matches development"
            exit 0
          fi

          # --merge keeps both branches' history and records the merge as its
          # own commit, so main's log shows what arrived and when.
          #
          # --delete-branch=false because development is a long-lived branch,
          # not a feature branch. gh would otherwise offer to remove it.
          gh pr merge "$PR" --merge --delete-branch=false

          echo "merged PR #$PR into main"
  
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref_name == 'development'

    permissions:
      contents: read
      # The token is handed to the server so it can pull a private image.
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/bentoai_ci
          chmod 600 ~/.ssh/bentoai_ci
          # Accepts whatever key the host presents right now. The stronger
          # version is ssh-keyscan once locally, stored as a secret.
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Make sure the deploy directory exists
        run: |
          # scp will not create a missing directory, it only writes files. One
          # mkdir here means a fresh server needs nothing prepared by hand
          # except .env.
          ssh -i ~/.ssh/bentoai_ci -o IdentitiesOnly=yes \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            'mkdir -p ~/bentoai'

      - name: Copy the compose file
        run: |
          # No leading slash on the remote path, so it lands under the deploy
          # user's home directory. That user owns their home, so writing there
          # needs no sudo and no chown - which is what /opt/bentoai kept
          # refusing, since /opt belongs to root.
          scp -i ~/.ssh/bentoai_ci -o IdentitiesOnly=yes \
            docker-compose.yml \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:bentoai/docker-compose.yml"

      - name: Deploy
        env:
          IMAGE_URL: ghcr.io/alain-16/bentoai:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "bash -s" tells the remote shell to read its script from stdin, and
          # the heredoc below is that stdin.
          #
          # REMOTE is unquoted, so the runner fills in $IMAGE_URL and
          # $GHCR_TOKEN before the text is sent. That is what keeps the token
          # off the ssh command line, where the server's process list would
          # show it. Anything meant to be worked out on the server instead has
          # to be written \$like_this.
          ssh -i ~/.ssh/bentoai_ci -o IdentitiesOnly=yes \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" bash -s <<REMOTE
          set -euo pipefail
          cd ~/bentoai

          # This token dies with the workflow run, so nothing durable is left
          # on the server. --password-stdin keeps it out of the process list.
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          export IMAGE_URL='$IMAGE_URL'
          echo "deploying $IMAGE_URL"

          docker compose pull
          docker compose up -d

          docker logout ghcr.io
          REMOTE

      - name: Health check
        run: |
          # REMOTE is quoted this time, so the runner expands nothing. The loop
          # counter belongs to the server's shell, not this one.
          ssh -i ~/.ssh/bentoai_ci -o IdentitiesOnly=yes \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/bentoai

          # up -d returning means the container STARTED, not that it works.
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 http://localhost:8000/health > /dev/null; then
              echo "healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "never became healthy. Recent logs:"
          docker compose logs --tail 50
          exit 1
          REMOTE

      - name: Reachable from outside
        run: |
          # The check above proves the app works. This proves people can get to
          # it - a different failure, usually a firewall.
          curl -sf --max-time 15 "http://${{ secrets.PROD_HOST }}:8000/health"
          echo
