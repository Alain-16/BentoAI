services:
  postgres:
    image: postgres:17-alpine
    container_name: bentoai-db

    environment:
      POSTGRES_USER: bentoai
      POSTGRES_PASSWORD: bentoai
      POSTGRES_DB: bentoai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bentoai -d bentoai"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: ${IMAGE_URL}
    container_name: bentoai-backend

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_URL: postgresql+asyncpg://bentoai:bentoai@postgres:5432/bentoai
      APP_CORS_ORIGINS: http://localhost:3000

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
