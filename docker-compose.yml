services:
  postgres:
    image: postgres:17-alpine
    container_name: bentoai-db

    environment:
      POSTGRES_USER: bentoai
      POSTGRES_PASSWORD: bentoai
      POSTGRES_DB: bentoai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bentoai -d bentoai"]
      interval: 5s
      timeout: 5s
      retries: 0

volumes:
  postgres_data:
